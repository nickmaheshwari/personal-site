[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # USAJOBS_EMAIL is the same public address shown in the resume's Contact section,
  # so the secrets scanner would otherwise fail the build on index.html.
  SECRETS_SCAN_OMIT_KEYS = "USAJOBS_EMAIL"

# Hidden webapps and their APIs stay out of search engines.
[[headers]]
  for = "/i-need-a-job/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/api/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
